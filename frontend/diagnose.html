<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>JanSahayak Diagnostics v2</title>
  <style>
    body { font-family: monospace; background: #0f172a; color: #e2e8f0; padding: 2rem; }
    h2 { color: #38bdf8; }
    .ok   { color: #4ade80; }
    .err  { color: #f87171; }
    .warn { color: #facc15; }
    pre   { background: #1e293b; padding: 1rem; border-radius: 8px; overflow: auto; white-space: pre-wrap; }
    button { background: #3b82f6; color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; margin: 0.5rem 0.5rem 0.5rem 0; }
  </style>
</head>
<body>
  <h2>🔧 JanSahayak – Deep Diagnostics</h2>
  <pre id="log">Running checks...</pre>

  <button onclick="testFirestoreWrite()">▶ Test Firestore Write</button>
  <button onclick="testFirestoreRead()">▶ Test Firestore Read</button>
  <button onclick="testSignIn()">▶ Test Anonymous Sign-In</button>

  <!-- Firebase compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    const logEl = document.getElementById('log');
    let logs = [];

    function log(msg, type='info') {
      const icon = type==='ok'?'✅':type==='err'?'❌':'⚠️';
      const cls  = type==='ok'?'ok':type==='err'?'err':'warn';
      logs.push(`<span class="${cls}">${icon} ${msg}</span>`);
      logEl.innerHTML = logs.join('\n');
    }

    // Step 1: Check firebase global
    if (typeof firebase !== 'undefined') {
      log('firebase global loaded from CDN', 'ok');
    } else {
      log('firebase global MISSING – check CDN script tags', 'err');
    }

    // Step 2: Try initializeApp manually (with exact error)
    const firebaseConfig = {
      apiKey: "AIzaSyDCFYaL4CnnSMQfiEDBrAwa4vFfRde_Lb0",
      authDomain: "jansahayakai.firebaseapp.com",
      projectId: "jansahayakai",
      storageBucket: "jansahayakai.firebasestorage.app",
      messagingSenderId: "990870638643",
      appId: "1:990870638643:web:c92af5739763b9f1d45346",
    };

    let app, db, auth;

    // Check if already initialized (multiple script loads)
    try {
      const existing = firebase.apps;
      if (existing && existing.length > 0) {
        log(`Found ${existing.length} existing Firebase app(s) – using existing`, 'warn');
        app = existing[0];
      } else {
        app = firebase.initializeApp(firebaseConfig);
        log('firebase.initializeApp() succeeded', 'ok');
      }
    } catch(e) {
      log(`firebase.initializeApp() FAILED: [${e.code}] ${e.message}`, 'err');
    }

    // Step 3: Try auth
    try {
      auth = firebase.auth();
      log('firebase.auth() succeeded', 'ok');
      auth.onAuthStateChanged(u => {
        log(u ? `Auth user: ${u.email || u.uid}` : 'Auth: no user signed in (normal)', u ? 'ok' : 'warn');
      });
    } catch(e) {
      log(`firebase.auth() FAILED: [${e.code}] ${e.message}`, 'err');
    }

    // Step 4: Try Firestore
    try {
      db = firebase.firestore();
      log('firebase.firestore() succeeded', 'ok');
    } catch(e) {
      log(`firebase.firestore() FAILED: [${e.code}] ${e.message}`, 'err');
    }

    // Step 5: Check network reachability to Firebase
    fetch('https://firestore.googleapis.com/')
      .then(r => log(`Network: Firebase APIs reachable (HTTP ${r.status})`, 'ok'))
      .catch(e => log(`Network: Cannot reach Firebase APIs: ${e.message}`, 'err'));

    async function testFirestoreWrite() {
      if (!db) { log('Firestore not initialized', 'err'); return; }
      try {
        const ref = await db.collection('_diagnostics').add({
          test: true,
          ts: firebase.firestore.FieldValue.serverTimestamp()
        });
        log(`Firestore WRITE OK – doc id: ${ref.id}`, 'ok');
      } catch (e) {
        log(`Firestore WRITE FAILED: [${e.code}] ${e.message}`, 'err');
      }
    }

    async function testFirestoreRead() {
      if (!db) { log('Firestore not initialized', 'err'); return; }
      try {
        const snap = await db.collection('applications').limit(1).get();
        log(`Firestore READ OK – ${snap.size} doc(s) from 'applications'`, 'ok');
      } catch (e) {
        log(`Firestore READ FAILED: [${e.code}] ${e.message}`, 'err');
      }
    }

    async function testSignIn() {
      if (!auth) { log('Auth not initialized', 'err'); return; }
      try {
        const cred = await auth.signInAnonymously();
        log(`Anonymous sign-in OK – uid: ${cred.user.uid}`, 'ok');
      } catch (e) {
        log(`Anonymous sign-in FAILED: [${e.code}] ${e.message}`, 'err');
      }
    }
  </script>
</body>
</html>
